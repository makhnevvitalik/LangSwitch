name: Xcode - Build, Analyze and Release

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal macOS Build
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DERIVED_DATA: .build/ci
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and analyze
        run: |
          xcodebuild \
            -project LangSwitch.xcodeproj \
            -scheme LangSwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build analyze

      - name: Verify architectures and bundled licenses
        run: |
          app="$DERIVED_DATA/Build/Products/Release/LangSwitch.app"
          lipo "$app/Contents/MacOS/LangSwitch" -verify_arch arm64 x86_64
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          cmp THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"

      - name: Verify update network permissions
        run: |
          xcodebuild \
            -project LangSwitch.xcodeproj \
            -scheme LangSwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings -json > "$RUNNER_TEMP/langswitch-build-settings.json"

          python3 - <<'PY'
          import json
          import os
          import plistlib
          from pathlib import Path

          settings_file = Path(os.environ['RUNNER_TEMP']) / 'langswitch-build-settings.json'
          targets = json.loads(settings_file.read_text())
          settings = next(item['buildSettings'] for item in targets if item['target'] == 'LangSwitch')
          assert settings['ENABLE_APP_SANDBOX'] == 'YES', 'App Sandbox must remain enabled'
          assert settings['ENABLE_OUTGOING_NETWORK_CONNECTIONS'] == 'YES', 'Update checks need outgoing networking'
          entitlements_path = Path(settings['SRCROOT']) / settings['CODE_SIGN_ENTITLEMENTS']
          entitlements = plistlib.loads(entitlements_path.read_bytes())
          assert entitlements.get('com.apple.security.app-sandbox') is True, 'Missing sandbox entitlement'
          assert entitlements.get('com.apple.security.network.client') is True, 'Missing update network entitlement'
          print('Update network permissions verified')
          PY

      - name: Prepare unsigned release app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit from main." >&2
            exit 1
          fi

          app="$DERIVED_DATA/Build/Products/Release/LangSwitch.app"
          version="${GITHUB_REF_NAME#v}"
          app_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          if [[ "$app_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version." >&2
            exit 1
          fi

          mkdir -p unsigned
          archive="LangSwitch-${version}-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "unsigned/$archive"
          cp LangSwitch/LangSwitch.entitlements unsigned/LangSwitch.entitlements
          unzip -t "unsigned/$archive"

      - name: Upload unsigned release app
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-app
          path: |
            unsigned/LangSwitch-*-unsigned.zip
            unsigned/LangSwitch.entitlements
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-26
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Download unsigned release app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-app
          path: unsigned

      - name: Extract unsigned release app
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-work
          unzip -q "unsigned/LangSwitch-${version}-unsigned.zip" -d release-work

      - name: Sign release app with stable identity
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$SIGNING_CERTIFICATE_P12" || -z "$SIGNING_CERTIFICATE_PASSWORD" ]]; then
            echo "The release-signing environment is missing its certificate secrets." >&2
            exit 1
          fi

          app="release-work/LangSwitch.app"
          certificate_path="$RUNNER_TEMP/LangSwitch-release-signing.p12"
          certificate_pem="$RUNNER_TEMP/LangSwitch-release-signing.crt"
          keychain_path="$RUNNER_TEMP/LangSwitch-release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 36 | tr -d '\n')"
          expected_identity="25A630937F64C708694E847E5A4CD56374BFCB15"
          original_keychains=()

          while IFS= read -r keychain; do
            keychain="${keychain//\"/}"
            [[ -n "$keychain" ]] && original_keychains+=("$keychain")
          done < <(security list-keychains -d user)

          cleanup() {
            security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
            security remove-trusted-cert -d "$certificate_pem" >/dev/null 2>&1 || true
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$certificate_pem"
          }
          trap cleanup EXIT

          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            >/dev/null
          security find-certificate \
            -c "LangSwitch Release Signing" \
            -p \
            "$keychain_path" \
            > "$certificate_pem"
          security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k "$keychain_path" \
            "$certificate_pem"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" \
            >/dev/null

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/LangSwitch Release Signing/ { print $2; exit }')"
          if [[ "$identity" != "$expected_identity" ]]; then
            echo "Unexpected release-signing certificate: ${identity:-not found}." >&2
            exit 1
          fi

          designated_requirement="designated => certificate leaf = H\"$expected_identity\" and identifier \"com.makhnevvitalik.LangSwitch\""
          verification_requirement="certificate leaf = H\"$expected_identity\" and identifier \"com.makhnevvitalik.LangSwitch\""
          codesign \
            --force \
            --sign "$identity" \
            --keychain "$keychain_path" \
            -r="$designated_requirement" \
            --options runtime \
            --timestamp=none \
            --entitlements "unsigned/LangSwitch.entitlements" \
            "$app"
          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            -R="$verification_requirement" \
            "$app"

      - name: Package signed release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="release-work/LangSwitch.app"
          archive="LangSwitch-${version}-macos-universal.zip"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$archive"
          unzip -t "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="LangSwitch-${version}-macos-universal.zip"
          notes="Download $archive for Apple Silicon or Intel Macs running macOS 11 or later. This build is self-signed and is not notarized by Apple; see the README for first-launch and Input Monitoring setup."
          gh release create "$GITHUB_REF_NAME" \
            "dist/$archive#Universal macOS app" \
            "dist/SHA256SUMS.txt#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "LangSwitch $version" \
            --notes "$notes"
