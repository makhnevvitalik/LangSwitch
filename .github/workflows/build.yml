name: Xcode - Build, Analyze and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal macOS Build
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DERIVED_DATA: .build/ci
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and analyze
        run: |
          xcodebuild \
            -project LangSwitch.xcodeproj \
            -scheme LangSwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build analyze

      - name: Verify architectures and bundled licenses
        run: |
          app="$DERIVED_DATA/Build/Products/Release/LangSwitch.app"
          lipo "$app/Contents/MacOS/LangSwitch" -verify_arch arm64 x86_64
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          cmp THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md"

      - name: Verify update network permissions
        run: |
          xcodebuild \
            -project LangSwitch.xcodeproj \
            -scheme LangSwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings -json > "$RUNNER_TEMP/langswitch-build-settings.json"

          python3 - <<'PY'
          import json
          import os
          import plistlib
          from pathlib import Path

          settings_file = Path(os.environ['RUNNER_TEMP']) / 'langswitch-build-settings.json'
          targets = json.loads(settings_file.read_text())
          settings = next(item['buildSettings'] for item in targets if item['target'] == 'LangSwitch')
          assert settings['ENABLE_APP_SANDBOX'] == 'YES', 'App Sandbox must remain enabled'
          assert settings['ENABLE_OUTGOING_NETWORK_CONNECTIONS'] == 'YES', 'Update checks need outgoing networking'
          entitlements_path = Path(settings['SRCROOT']) / settings['CODE_SIGN_ENTITLEMENTS']
          entitlements = plistlib.loads(entitlements_path.read_bytes())
          assert entitlements.get('com.apple.security.app-sandbox') is True, 'Missing sandbox entitlement'
          assert entitlements.get('com.apple.security.network.client') is True, 'Missing update network entitlement'
          print('Update network permissions verified')
          PY

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          app="$DERIVED_DATA/Build/Products/Release/LangSwitch.app"
          version="${GITHUB_REF_NAME#v}"
          app_version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          if [[ "$app_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version." >&2
            exit 1
          fi

          codesign \
            --force \
            --sign - \
            --options runtime \
            --entitlements LangSwitch/LangSwitch.entitlements \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          mkdir -p dist
          archive="LangSwitch-${version}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$archive"
          unzip -t "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS.txt)

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/LangSwitch-*-macos-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="LangSwitch-${version}-macos-universal.zip"
          notes="Download $archive for Apple Silicon or Intel Macs running macOS 11 or later. This build is ad-hoc signed and is not notarized by Apple; see the README for first-launch and Input Monitoring setup."
          gh release create "$GITHUB_REF_NAME" \
            "dist/$archive#Universal macOS app" \
            "dist/SHA256SUMS.txt#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "LangSwitch $version" \
            --notes "$notes"
